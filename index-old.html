<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPA 195 iOS Loader</title>
</head>

<style>
  :root {
    -webkit-text-size-adjust: 100%;
  }

  html,
  body {
    margin: 0;
    padding: 0;
  }

  label,
  input,
  button {
    margin: 0.4rem 0;
    font-size: 1.4rem;
  }
</style>

<body>
  <dialog>
    <form method="dialog">
      <label>
        Enter your OpenProcessing sketch ID:
      </label>
      <br>
      <input type="text" name="sketchId" placeholder="1234567">
      <br>
      <button>Submit</button>
    </form>
  </dialog>

  <script>
    document.querySelector('dialog').showModal();
    document.querySelector('form').addEventListener('submit', async e => {
      if (typeof (DeviceMotionEvent.requestPermission) !== 'function') {
        alert('This page only works on mobile devices.');
        return
      }
      await DeviceMotionEvent.requestPermission();
      const formData = new FormData(e.target);
      const sketchId = formData.get('sketchId');
      const sketchPage = await requestAndParseSketchPage(sketchId);
      const sketchData = findSketchAndLibraries(sketchPage);
      await loadEngine(sketchData.engineURL);
      await loadLibraries(sketchData.libraries);
      runSketch(sketchData.code);
    });

    async function requestAndParseSketchPage(id) {
      const response = await fetch(`https://openprocessing.org/sketch/${id}`);
      const html = await response.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      return doc;
    }

    function findSketchAndLibraries(page) {
      const scripts = page.querySelectorAll('script');
      let rawSketchData = null;
      for (let script of scripts) {
        const text = script.textContent;
        if (text.includes('var sketch = {')) {
          eval(text);
          rawSketchData = sketch;
          break;
        }
      }
      const sketchData = {
        engineURL: rawSketchData.engineURL,
        libraries: rawSketchData.libraries,
        code: rawSketchData.versions[0].codeObjects[0].code
      }
      return sketchData;
    }

    async function loadEngine(url) {
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = url;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    async function loadLibraries(libraries) {
      for (const lib of libraries) {
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = lib.url;
          script.onload = resolve;
          script.onerror = reject;
          document.head.appendChild(script);
        });
      }
    }

    function runSketch(code) {
      new p5();
      window.eval(code);
    }
  </script>

</body>

</html>
