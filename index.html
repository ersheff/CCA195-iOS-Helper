<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/p5@latest/lib/p5.js"></script>
  <title>Document</title>
</head>

<style>
  html,
  body {
    margin: 0;
    padding: 0;
  }

  label,
  input,
  button {
    margin: 0.4rem 0;
    font-size: 1.4rem;
  }
</style>

<body>
  <dialog>
    <form method="dialog">
      <label>
        Enter your OpenProcessing sketch ID:
      </label>
      <br>
      <input type="text" name="sketchId" placeholder="1234567">
      <br>
      <button>Submit</button>
    </form>
  </dialog>

  <script>
    document.querySelector('dialog').showModal();
    document.querySelector('form').addEventListener('submit', async e => {
      await DeviceMotionEvent.requestPermission();
      const formData = new FormData(e.target);
      const sketchId = formData.get('sketchId');
      const response = await fetch(`https://openprocessing.org/sketch/${sketchId}`);
      const html = await response.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const scripts = doc.querySelectorAll('script');
      let sketchData = null;
      for (let script of scripts) {
        const text = script.textContent;
        if (text.includes('var sketch = {')) {
          eval(text);
          sketchData = sketch;
          break;
        }
      }
      const sketchCode = sketchData.versions[0].codeObjects[0].code;
      runSketch(sketchCode);
    });

    function runSketch(code) {
      console.log(code);
      new p5();
      window.eval(code);
    }
  </script>

</body>

</html>
