<button id="motion">Enable motion</button>
<pre id="output">Waiting for permission...</pre>
<iframe
    allow="accelerometer; gyroscope;"
    src=""
    frameborder="0"
    style="width: 100%; height: 100vh"
></iframe>

<script>
    const output = document.querySelector("#output");

    document.querySelector("#motion").onclick = async () => {
        try {
            if (typeof DeviceMotionEvent.requestPermission === "function") {
                const result = await DeviceMotionEvent.requestPermission();

                if (result !== "granted") {
                    output.textContent = "Permission denied";
                    return;
                }
            }

            window.addEventListener("devicemotion", (event) => {
                output.textContent = JSON.stringify(
                    {
                        acceleration: event.accelerationIncludingGravity,
                        rotationRate: event.rotationRate,
                    },
                    null,
                    2,
                );
            });

            output.textContent = "Permission granted; waiting for events...";
            document.querySelector("iframe").src =
                "https://preview.p5js.org/ersheff/embed/57qJh0loC";
        } catch (error) {
            output.textContent = error.toString();
        }
    };
</script>
